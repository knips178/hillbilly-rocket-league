  .big.bad{background:#3d1e1a;color:#ffab99;border-color:#7a3f36}
  .big.mid{background:#3a3016;color:#ffd88a;border-color:#8a6f2e}
  .kv{font:12px/1.5 ui-monospace,Menlo,monospace;color:#b8a888;white-space:pre-wrap;word-break:break-word;
      background:#1c1812;border:2px solid #4a3f2c;border-radius:10px;padding:12px;margin-top:12px}
  .note{font-size:12px;color:#8f7f66;margin-top:10px}
</style>

<h1>🎮 Hillbilly RL — Connection Test <span id="build" style="font-size:13px;color:#8ee89c;border:1px solid #3f7a48;border-radius:6px;padding:2px 7px;vertical-align:middle"></span></h1>

<div class="steps">
  <b>1.</b> Open this page on <b>both</b> devices.<br>
  <b>2.</b> Pick the <b>same method</b> and leave the code as <b>HRLTEST</b> on both.<br>
  <b>3.</b> Press START on both <b>within ~30 seconds of each other</b>.<br>
  <b>4.</b> When it finishes, press COPY RESULTS on <b>each</b> device.
</div>

<label>Method (must match on both devices)</label>
<div class="row" id="strat-row">
  <button data-s="nostr" class="sel">Nostr</button>
  <button data-s="mqtt">MQTT</button>
  <button data-s="torrent">BitTorrent</button>
</div>

<label>Room code — identical on both devices</label>
<input id="room" value="HRLTEST" autocapitalize="characters" autocomplete="off" spellcheck="false">

<button id="go">▶️  START TEST</button>
<div id="status" class="big" style="display:none">…</div>
<div id="kv" class="kv" style="display:none"></div>
<button id="copy" class="sec" style="display:none">📋 COPY RESULTS (paste back to Claude)</button>
<div class="note" id="note"></div>

<script>
const LABEL={nostr:'Nostr relays (curated)',mqtt:'MQTT brokers',torrent:'BitTorrent trackers'};
const NOSTR_RELAYS=['wss://relay.damus.io','wss://nos.lol','wss://relay.primal.net','wss://relay.nostr.band'];
const LOOPBACK=new URLSearchParams(location.search).has('loopback');
const TEST_SECS=70;
let STRAT='nostr';
const BUILD='v4';

// Trystero ships exactly ONE default STUN server (stun.cloudflare.com), which
// returned ICE error 701 (unreachable) on the real test network -- so no srflx
// candidates could be gathered and cross-network connection was impossible.
// Always pass an explicit, redundant list.
const ICE_SERVERS=[
  {urls:['stun:stun.l.google.com:19302',
         'stun:stun1.l.google.com:19302',
         'stun:stun2.l.google.com:19302']},
  {urls:'stun:global.stun.twilio.com:3478'},
  {urls:'stun:stun.cloudflare.com:3478'}
];

document.getElementById('build').textContent='build '+BUILD;
const q=new URLSearchParams(location.search);
if(q.get('r')) document.getElementById('room').value=q.get('r').toUpperCase();
if(q.get('s')&&LABEL[q.get('s')]) STRAT=q.get('s');
if(LOOPBACK) document.getElementById('note').textContent=
  'Loopback mode: for testing two tabs on ONE machine only.';

document.querySelectorAll('#strat-row button').forEach(b=>{
  if(b.dataset.s===STRAT) b.classList.add('sel'); else b.classList.remove('sel');
  b.onclick=()=>{ STRAT=b.dataset.s;
    document.querySelectorAll('#strat-row button').forEach(x=>x.classList.toggle('sel',x===b)); };
});

// Relay sockets, classified by URL so counts are never misattributed.
const _WS=window.WebSocket; window.WSLOG=[];
window.WebSocket=function(u,p){
  const rec={url:String(u),state:'connecting'}; window.WSLOG.push(rec);
  const w=p===undefined?new _WS(u):new _WS(u,p);
  w.addEventListener('open',()=>rec.state='open');
  w.addEventListener('error',()=>{if(rec.state!=='open')rec.state='error'});
  w.addEventListener('close',()=>{if(rec.state!=='open')rec.state='closed'});
  return w;
};
window.WebSocket.prototype=_WS.prototype; Object.assign(window.WebSocket,_WS);

// Distinguishing "nobody there" from "couldn't connect":
// counting RTCPeerConnections does NOT work -- Trystero pre-creates ~20 per
// strategy speculatively, even alone in an empty room. setRemoteDescription
// does, because it requires a real SDP from the other device.
const _PC=window.RTCPeerConnection;
window.PCSTAT={created:0,remoteSDP:0,remoteCand:0,states:{},err:[]};
window.RTCPeerConnection=function(cfg){
  const pc=new _PC(cfg); window.PCSTAT.created++;
  const _srd=pc.setRemoteDescription.bind(pc);
  pc.setRemoteDescription=d=>{window.PCSTAT.remoteSDP++;return _srd(d)};
  const _aic=pc.addIceCandidate.bind(pc);
  pc.addIceCandidate=c=>{window.PCSTAT.remoteCand++;return _aic(c)};
  pc.addEventListener('connectionstatechange',()=>{
    const s=pc.connectionState; window.PCSTAT.states[s]=(window.PCSTAT.states[s]||0)+1; });
  pc.addEventListener('icecandidateerror',e=>{
    if(window.PCSTAT.err.length<4) window.PCSTAT.err.push((e.url||'?')+' #'+e.errorCode); });
  return pc;
};
window.RTCPeerConnection.prototype=_PC.prototype; Object.assign(window.RTCPeerConnection,_PC);

const RES={peers:0,everPeer:0,rtt:[],rttN:0,ice:'',err:'',candTypes:{},stunOk:{}};

function render(final){
  const st=document.getElementById('status'), kv=document.getElementById('kv');
  st.style.display='block'; kv.style.display='block';
  const P=window.PCSTAT, up=window.WSLOG.filter(w=>w.state==='open').length;
  if(RES.rttN>0){ st.className='big ok'; st.textContent='✅ CONNECTED — data flowing both ways'; }
  else if(P.remoteSDP>0){ st.className='big mid';
    st.textContent=(final?'⚠️ ':'⏳ ')+'Found the other device, but the link failed'+(final?' — needs a TURN relay':'…'); }
  else if(up>0){ st.className='big '+(final?'bad':'');
    st.textContent=final?'❌ Never saw the other device (matchmaking never paired you)':'⏳ Waiting for the other device…'; }
  else { st.className='big bad'; st.textContent=final?'❌ Could not reach any matchmaking relay':'⏳ Connecting to relays…'; }
  const t=RES.rtt.slice().sort((a,b)=>a-b);
  kv.textContent=
    'method     : '+LABEL[STRAT]+'\n'+
    'relays up  : '+up+'/'+window.WSLOG.length+'\n'+
    'remoteSDP  : '+P.remoteSDP+'   (>0 means the devices found each other)\n'+
    'remoteCand : '+P.remoteCand+'\n'+
    'peers now  : '+RES.peers+'   (seen '+RES.everPeer+')\n'+
    'data msgs  : '+RES.rttN+'\n'+
    (t.length?'rtt ms     : avg '+Math.round(t.reduce((a,b)=>a+b,0)/t.length)+
              '  p95 '+Math.round(t[Math.floor(t.length*0.95)]||t[t.length-1])+'\n':'')+
    'ice route  : '+(RES.ice||'—')+'\n'+
    'my cands   : '+(Object.keys(RES.candTypes).join(',')||'—')+'\n'+
    'stun ok    : '+(Object.keys(RES.stunOk).join(' ')||'—')+'\n'+
    'pc states  : '+JSON.stringify(P.states)+'\n'+
    'pc created : '+P.created+
    (RES.err?'\nerror      : '+RES.err:'')+
    (P.err.length?'\nice errors : '+P.err.join(' | '):'');
}

document.getElementById('go').onclick=()=>{
  const room=document.getElementById('room').value.trim().toUpperCase(); if(!room) return;
  const go=document.getElementById('go');
  go.disabled=true; go.textContent='⏳ TESTING… ('+TEST_SECS+'s)';
  history.replaceState(null,'','?s='+STRAT+'&r='+encodeURIComponent(room)+(LOOPBACK?'&loopback=1':''));

  let r;
  try{
    const cfg={appId:'hrl-conn-test-v1', rtcConfig:{iceServers:ICE_SERVERS}};
    if(STRAT==='nostr') cfg.relayConfig={urls:NOSTR_RELAYS,redundancy:4};
    if(LOOPBACK) cfg._test_only_mdnsHostFallbackToLoopback=true;
    r=HRLNet[STRAT](cfg,room);
  }catch(e){ RES.err=e.message; render(true); go.disabled=false; return; }

  // what kinds of candidate can this network even produce? (srflx missing => STUN blocked)
  try{
    const probe=new _PC({iceServers:ICE_SERVERS});
    probe.createDataChannel('p');
    probe.onicecandidate=e=>{ if(e.candidate){ RES.candTypes[e.candidate.type||'?']=1;
      if(e.candidate.type==='srflx'&&e.candidate.url) RES.stunOk[e.candidate.url]=1; } else probe.close(); };
    probe.createOffer().then(o=>probe.setLocalDescription(o));
    setTimeout(()=>{try{probe.close()}catch(e){}},9000);
  }catch(e){}

  const echo=r.makeAction('echo');
  echo.onMessage=(d,ctx)=>{ if(d&&d.reply) echo.send({ack:d.n},{target:ctx.peerId}); };
  r.onPeerJoin=()=>{RES.everPeer++}; r.onPeerLeave=()=>{};

  let n=0;
  const iv=setInterval(async()=>{
    try{
      const peers=r.getPeers(), ids=Object.keys(peers);
      RES.peers=ids.length;
      if(ids.length){
        echo.send({reply:true,n:n++,pad:'x'.repeat(200)});
        try{ RES.rtt.push(await r.ping(ids[0])); RES.rttN++; }catch(e){}
        if(!RES.ice){
          const stats=await peers[ids[0]].getStats(); let pair=null,c={};
          stats.forEach(v=>{ if(v.type==='candidate-pair'&&v.state==='succeeded'&&v.nominated)pair=v;
                             if(v.type==='local-candidate'||v.type==='remote-candidate')c[v.id]=v; });
          if(pair){ const l=c[pair.localCandidateId],rm=c[pair.remoteCandidateId];
            if(l&&rm) RES.ice=l.candidateType+' / '+rm.candidateType+
              ((l.candidateType==='relay'||rm.candidateType==='relay')?'  (TURN RELAY)':'  (direct P2P)'); }
        }
      }
      render(false);
    }catch(e){}
  },800);

  let left=TEST_SECS;
  const cd=setInterval(()=>{
    left--; go.textContent='⏳ TESTING… ('+left+'s)'; render(false);
    if(left<=0){ clearInterval(cd); clearInterval(iv); try{r.leave()}catch(e){}
      render(true); go.textContent='▶️  RUN AGAIN'; go.disabled=false;
      document.getElementById('copy').style.display='block'; }
  },1000);
};

document.getElementById('copy').onclick=()=>{
  const txt='HRL CONN TEST '+BUILD+'\nUA: '+navigator.userAgent+'\n'+
    'method: '+STRAT+'   room: '+document.getElementById('room').value+'\n\n'+
    document.getElementById('kv').textContent+'\n\nsockets:\n'+
    window.WSLOG.map(w=>'  '+w.state+' '+w.url).join('\n');
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{document.execCommand('copy')}catch(e){}
  if(navigator.clipboard) navigator.clipboard.writeText(txt).catch(()=>{});
  ta.remove();
  document.getElementById('copy').textContent='✅ COPIED — paste back to Claude';
};
</script>

</body></html>
